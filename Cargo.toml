[package]
name = "kalshi-cli"
version = "0.1.2"
edition = "2024"
description = "CLI for the Kalshi prediction market API"
homepage = "https://github.com/hanzpo/kalshi-cli"
repository = "https://github.com/hanzpo/kalshi-cli"
documentation = "https://github.com/hanzpo/kalshi-cli#readme"
license = "MIT"

[[bin]]
name = "kalshi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "6"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.11"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
comfy-table = { version = "7", features = ["custom_styling"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
crossterm = "0.29"
terminal_size = "0.4"
csv = "1.3"
clap_complete = "4"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
rustyline = "18"
shell-words = "1"

[dev-dependencies]
http = "1.4.0"
tempfile = "3"
